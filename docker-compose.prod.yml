services:
  web:
    image: ghcr.io/takuto88/takuto-de:${WEBSITE_VERSION}
    restart: unless-stopped
    volumes:
      - /opt/takuto-website/uploads:/usr/share/nginx/html/uploads:ro
    networks:
      - nginx-proxy
    environment:
      - VIRTUAL_HOST=${DOMAINS_STR}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAINS_STR}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  screego:
    image: ghcr.io/screego/server:${SCREEGO_VERSION}
    restart: unless-stopped
    # Port 5050 is closed in the Hetzner firewall; only nginx-proxy reaches it
    network_mode: host
    environment:
      - VIRTUAL_HOST=${SCREEGO_DOMAIN}
      - VIRTUAL_PORT=5050
      - LETSENCRYPT_HOST=${SCREEGO_DOMAIN}
      - SCREEGO_EXTERNAL_IP=${SCREEGO_EXTERNAL_IP}
      - SCREEGO_TURN_PORT_RANGE=${SCREEGO_TURN_PORT_RANGE}
      - SCREEGO_TRUST_PROXY_HEADERS=true
      # Access is guarded by basic auth in nginx-proxy
      - SCREEGO_AUTH_MODE=none
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.10.2
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /opt/nginx-proxy/conf.d:/etc/nginx/conf.d
      - /opt/nginx-proxy/vhost.d:/etc/nginx/vhost.d
      - /opt/nginx-proxy/html:/usr/share/nginx/html
      - /opt/nginx-proxy/certs:/etc/nginx/certs:ro
      - /opt/nginx-proxy/htpasswd:/etc/nginx/htpasswd:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  acme-companion:
    image: nginxproxy/acme-companion:2.6.3
    container_name: letsencrypt-companion
    restart: always
    networks:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/nginx-proxy/certs:/etc/nginx/certs
      - /opt/nginx-proxy/vhost.d:/etc/nginx/vhost.d
      - /opt/nginx-proxy/html:/usr/share/nginx/html
    environment:
      DEFAULT_EMAIL: "${EMAIL_FOR_CERTBOT}"
      ACME_CA_URI: "https://acme-v02.api.letsencrypt.org/directory"
      NGINX_PROXY_CONTAINER: nginx-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nginx-proxy:
    driver: bridge
