---
- name: Ensure hcloud Python package is installed
  pip:
    name: hcloud
    state: present
  delegate_to: localhost

- name: Add CI SSH key to Hetzner Cloud
  hcloud_ssh_key:
    api_token: "{{ hcloud_token }}"
    name: "{{ ci_ssh_key_name }}"
    public_key: "{{ ci_ssh_public_key }}"
    state: present
  register: hcloud_ci_ssh_key
  delegate_to: localhost

- name: Add admin SSH key to Hetzner Cloud
  hcloud_ssh_key:
    api_token: "{{ hcloud_token }}"
    name: "{{ admin_ssh_key_name }}"
    public_key: "{{ admin_ssh_public_key }}"
    state: present
  register: hcloud_admin_ssh_key
  delegate_to: localhost

- name: Ensure Hetzner Cloud firewall
  hetzner.hcloud.firewall:
    api_token: "{{ hcloud_token }}"
    name: "{{ firewall_name }}"
    rules:
      - description: "Allow SSH"
        direction: in
        protocol: tcp
        port: "22"
        source_ips: "{{ firewall_ssh_cidrs if firewall_ssh_cidrs | default([]) else ['0.0.0.0/0', '::/0'] }}"
      - description: "Allow HTTP"
        direction: in
        protocol: tcp
        port: "80"
        source_ips:
          - "0.0.0.0/0"
          - "::/0"
      - description: "Allow HTTPS"
        direction: in
        protocol: tcp
        port: "443"
        source_ips:
          - "0.0.0.0/0"
          - "::/0"
    state: present
  delegate_to: localhost

- name: Create Hetzner Cloud server
  hcloud_server:
    api_token: "{{ hcloud_token }}"
    name: "{{ server_name }}"
    server_type: "{{ server_type }}"
    image: "{{ server_image }}"
    location: "{{ server_location }}"
    firewalls:
      - "{{ firewall_name }}"
    ssh_keys:
      - "{{ ci_ssh_key_name }}"
      - "{{ admin_ssh_key_name }}"
    state: "{{ 'rebuild' if force_recreate | default(false) | bool else 'present' }}"
  register: hcloud_server
  delegate_to: localhost

- name: Wait for SSH to come up
  wait_for:
    host: "{{ hcloud_server.hcloud_server.ipv4_address }}"
    port: 22
    delay: 10
    timeout: 300
  delegate_to: localhost
  when: hcloud_server.changed

- name: Add host to dynamic inventory
  add_host:
    name: "{{ server_name }}"
    groups: web
    ansible_host: "{{ hcloud_server.hcloud_server.ipv4_address }}"
    ansible_user: root
  delegate_to: localhost

- name: Create temporary directory for GCP credentials
  tempfile:
    state: directory
    prefix: gcp_creds_
  register: gcp_creds_dir
  delegate_to: localhost

- name: Write GCP service account credentials to file
  copy:
    content: "{{ gcloud_dns_service_account }}"
    dest: "{{ gcp_creds_dir.path }}/credentials.json"
    mode: '0600'
  delegate_to: localhost

- name: Get server IPv6 address
  hcloud_server_info:
    api_token: "{{ hcloud_token }}"
    name: "{{ server_name }}"
  register: server_info
  delegate_to: localhost

- name: Get Google Cloud DNS managed zone
  google.cloud.gcp_dns_managed_zone:
    name: "{{ gcloud_dns_zone }}"
    dns_name: "takuto.de."
    description: "Managed zone for takuto.de"
    project: "{{ (gcloud_dns_service_account.project_id) if (gcloud_dns_service_account is mapping) else (gcloud_dns_service_account | from_json | json_query('project_id')) }}"
    auth_kind: "serviceaccount"
    service_account_file: "{{ gcp_creds_dir.path }}/credentials.json"
    state: present
  register: managed_zone
  delegate_to: localhost

- name: Update DNS A record for domain in Google Cloud DNS
  google.cloud.gcp_dns_resource_record_set:
    name: "takuto.de."
    type: 'A'
    ttl: 300
    target:
      - "{{ hcloud_server.hcloud_server.ipv4_address }}"
    managed_zone: "{{ managed_zone }}"
    project: "{{ (gcloud_dns_service_account.project_id) if (gcloud_dns_service_account is mapping) else (gcloud_dns_service_account | from_json | json_query('project_id')) }}"
    auth_kind: "serviceaccount"
    service_account_file: "{{ gcp_creds_dir.path }}/credentials.json"
    state: present
  delegate_to: localhost

- name: Update DNS AAAA record for domain in Google Cloud DNS
  google.cloud.gcp_dns_resource_record_set:
    name: "takuto.de."
    type: 'AAAA'
    ttl: 300
    target:
      - "{{ server_info.hcloud_server_info[0].ipv6 | regex_replace('/64$', '1') }}"
    managed_zone: "{{ managed_zone }}"
    project: "{{ (gcloud_dns_service_account.project_id) if (gcloud_dns_service_account is mapping) else (gcloud_dns_service_account | from_json | json_query('project_id')) }}"
    auth_kind: "serviceaccount"
    service_account_file: "{{ gcp_creds_dir.path }}/credentials.json"
    state: present
  delegate_to: localhost
  when: server_info.hcloud_server_info[0].ipv6 is defined

- name: Remove temporary GCP credentials
  file:
    path: "{{ gcp_creds_dir.path }}"
    state: absent
  delegate_to: localhost

- name: Set expected DNS records
  set_fact:
    expected_dns_records: >-
      {{ [hcloud_server.hcloud_server.ipv4_address]
         + ([server_info.hcloud_server_info[0].ipv6 | regex_replace('/64$', '1')]
            if server_info.hcloud_server_info[0].ipv6 is defined else []) }}

- name: Wait for DNS record propagation (using Google DNS 8.8.8.8)
  shell: >
    dig @8.8.8.8 takuto.de. A AAAA +short +tries=1
  register: dns_check
  until: (expected_dns_records | reject('in', dns_check.stdout_lines | default([]) | map('trim') | list) | list) | length == 0
  retries: 60
  delay: 5
  delegate_to: localhost
  failed_when: false

- name: Display current DNS values
  debug:
    msg: |
      Expected records: {{ expected_dns_records | join(', ') }}
      Current DNS resolution: {{ dns_check.stdout_lines | default([]) | map('trim') | list | join(', ') }}
  when: (expected_dns_records | reject('in', dns_check.stdout_lines | default([]) | map('trim') | list) | list) | length > 0
  delegate_to: localhost

- name: Check if DNS propagation completed in time
  fail:
    msg: "DNS propagation did not complete within the timeout period (5 minutes). Expected {{ expected_dns_records | join(', ') }} but got {{ dns_check.stdout_lines | default([]) | map('trim') | list | join(', ') }}."
  when: (expected_dns_records | reject('in', dns_check.stdout_lines | default([]) | map('trim') | list) | list) | length > 0
  delegate_to: localhost
