---
- name: Create application directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/nginx-proxy
    - /opt/nginx-proxy/conf.d
    - /opt/nginx-proxy/vhost.d
    - /opt/nginx-proxy/html
    - /opt/nginx-proxy/certs
    - /opt/takuto-website
    - /opt/takuto-website/uploads

- name: Copy docker-compose files to deployment directory
  copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: /opt/takuto-website/
    mode: '0644'
  loop:
    - "docker-compose.yml"
    - "docker-compose.prod.yml"


- name: Pull Docker image for the website
  community.docker.docker_image:
    name: "ghcr.io/takuto88/takuto-de:{{ website_version }}"
    source: pull
    force_source: yes
    state: present

- name: Create environment file for Docker Compose
  copy:
    content: |
      EMAIL_FOR_CERTBOT={{ email_for_certbot }}
      DOMAINS_STR={{ domains | join(',') }}
      WEBSITE_VERSION={{ website_version }}
    dest: /opt/takuto-website/.env
    mode: '0600'

- name: Run website with Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/takuto-website
    files:
      - docker-compose.yml
      - docker-compose.prod.yml
    state: present
    env_files:
      - .env

- name: Prune unused Docker images
  community.docker.docker_prune:
    images: yes

- name: Check HTTPS health of the deployed site
  shell: >
    curl -fsS --max-time 10 "https://{{ domains[0] }}/"
  args:
    executable: /bin/bash
  register: health_check
  changed_when: false
  retries: 12
  delay: 15
  until: health_check.rc == 0
  delegate_to: localhost
  become: no

- name: Install acme-companion renewal service
  copy:
    content: |
      [Unit]
      Description=Restart acme-companion so it checks for certificate renewal
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker restart letsencrypt-companion
    dest: /etc/systemd/system/acme-companion-renew.service
    mode: '0644'
  register: renewal_service

- name: Install acme-companion renewal timer
  copy:
    content: |
      [Unit]
      Description=Restart acme-companion daily to allow certificate renewal

      [Timer]
      OnCalendar=daily
      Persistent=true
      RandomizedDelaySec=3600

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/acme-companion-renew.timer
    mode: '0644'
  register: renewal_timer

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  when: renewal_service.changed or renewal_timer.changed

- name: Enable and start acme-companion renewal timer
  systemd:
    name: acme-companion-renew.timer
    enabled: yes
    state: started

- name: Check that the certificate is not close to expiry
  stat:
    path: "/opt/nginx-proxy/certs/{{ domains[0] }}.crt"
  register: cert_file

- name: Check certificate expiry
  command: >
    openssl x509 -noout -checkend {{ cert_min_days_remaining * 86400 }}
    -in "/opt/nginx-proxy/certs/{{ domains[0] }}.crt"
  register: cert_expiry
  changed_when: false
  failed_when: false
  when: cert_file.stat.exists

- name: Fail when the certificate expires within {{ cert_min_days_remaining }} days
  fail:
    msg: "Certificate for {{ domains[0] }} expires within {{ cert_min_days_remaining }} days. The acme-companion should have renewed it - check the letsencrypt-companion container logs."
  when: cert_file.stat.exists and cert_expiry.rc == 1
