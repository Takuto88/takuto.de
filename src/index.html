<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lennart Rosam</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <!-- static for Mastodon website verification (verifier may not run JS); the visible link below keeps rel="me" too -->
  <link rel="me" href="https://norden.social/@takuto">
  <style>
    /* VT323, self-hosted so no visitor request ever leaves this domain */
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/vt323-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/vt323-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --ph: #39ff5e;
      --ph-dim: #1e8f42;
      --ph-dark: #0d3a1f;
      --amber: #ffb347;
      --bg: #040704;
      --panel: #071108;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    [hidden] { display: none !important; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'VT323', 'Courier New', monospace;
      color: var(--ph);
      padding: 28px 14px;
    }

    /* ---- CRT shell ---- */
    .crt {
      width: min(760px, 100%);
      background:
        radial-gradient(ellipse at 50% 40%, rgba(57, 255, 94, 0.05), transparent 65%),
        var(--panel);
      border: 2px solid #14301b;
      border-radius: 14px;
      box-shadow:
        0 0 48px rgba(57, 255, 94, 0.09),
        inset 0 0 80px rgba(0, 0, 0, 0.65);
      position: relative;
      overflow: hidden;
      padding: 30px 30px 38px;
    }
    .crt::after { /* scanlines */
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg,
        rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
      z-index: 3;
    }
    .crt::before { /* drifting refresh band */
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 90px;
      top: -100px;
      background: linear-gradient(180deg,
        transparent, rgba(57, 255, 94, 0.055), transparent);
      animation: band 7s linear infinite;
      z-index: 2;
      pointer-events: none;
    }
    @keyframes band { to { transform: translateY(calc(100vh + 200px)); } }
    .flicker { animation: flicker 5s steps(2) infinite; }
    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; }
      97% { opacity: 0.88; }
      98% { opacity: 0.96; }
    }

    /* ---- screen ---- */
    .screen {
      position: relative;
      z-index: 1;
      min-height: min(540px, 68vh);
      display: flex;
      flex-direction: column;
    }
    pre {
      margin: 0;
      font-size: 21px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      text-shadow: 0 0 9px rgba(57, 255, 94, 0.45);
    }
    .dim   { color: var(--ph-dim); text-shadow: 0 0 6px rgba(30, 143, 66, 0.4); }
    .amber { color: var(--amber); text-shadow: 0 0 9px rgba(255, 179, 71, 0.4); }
    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.05em;
      background: var(--ph);
      vertical-align: text-bottom;
      box-shadow: 0 0 9px rgba(57, 255, 94, 0.7);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    a { color: var(--amber); text-decoration: none; }
    a:hover, a:focus-visible {
      background: rgba(255, 179, 71, 0.2);
      text-decoration: underline;
    }

    /* cursor parked at the top-left while the screen is "cleared" */
    #cls-cursor { position: absolute; top: 0; left: 0; }

    /* ---- profile view (shown after CLS) ---- */
    .profile-view {
      margin: auto; /* dead center in the screen */
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .banner { margin-bottom: 14px; }
    .profile {
      display: flex;
      gap: 22px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .profile-pic {
      width: 124px;
      height: 124px;
      object-fit: cover;
      image-rendering: pixelated;
      filter: sepia(1) hue-rotate(55deg) saturate(2.2) brightness(0.82) contrast(1.1);
      border: 3px solid var(--ph-dark);
      outline: 2px solid #020502;
      box-shadow: 0 0 20px rgba(57, 255, 94, 0.28);
      flex: none;
    }
    #tail { margin-top: 16px; }

    @media (prefers-reduced-motion: reduce) {
      .crt::before, .cursor, .flicker { animation: none; }
    }
  </style>
</head>
<body>
  <div class="crt flicker">
    <div class="screen">
      <pre id="boot"><span class="cursor"></span></pre>
      <span class="cursor" id="cls-cursor" hidden></span>

      <section class="profile-view" id="profile" hidden>
        <pre class="banner"><span class="amber">OPERATOR PROFILE</span>
<span class="dim">================</span></pre>
        <div class="profile">
          <img class="profile-pic" src="img/profile.jpg" alt="Lennart Rosam">
          <pre class="fields">ID      : LENNART ROSAM
CLASS   : SOFTWARE ENGINEER
STATUS  : <span class="amber">HACKING TELCO @SIPGATE</span>
NETWORK : 2G / 3G / 4G CORE
PLMN    : 262 22 - SIPGATE WIRELESS</pre>
        </div>
        <pre id="tail"></pre>
      </section>
    </div>
  </div>

  <script>
    const bootLines = [
      ['TAKUTO.DE ACCESS TERMINAL 3000', ''],
      ['(C) 1988 LENNART ROSAM', 'dim'],
      ['', ''],
      ['AT', ''],
      ['OK', 'dim'],
      ['ATDT EPC.MNC022.MCC262.3GPPNETWORK.ORG', ''],
      ['CARRIER 14400', ''],
      ['> RRC_CONNECTED', ''],
      ['> ATTACH ACCEPTED', 'amber'],
      ['> PDP CONTEXT ACTIVATED', ''],
      ['> SESSION ESTABLISHED', 'amber'],
    ];

    const tailLines = [
      { t: '> CONTACT : hello@takuto.de',
        h: '> CONTACT : <a href="mailto:hello@takuto.de">hello@takuto.de</a>' },
      { t: '> PGP KEY : public-key.txt',
        h: '> PGP KEY : <a href="public-key.txt" target="_blank" rel="noopener">public-key.txt</a>' },
      { t: '> SOCIAL  : github / mastodon',
        h: '> SOCIAL  : <a href="https://github.com/Takuto88" target="_blank" rel="noopener">github</a> / <a href="https://norden.social/@takuto" target="_blank" rel="me noopener">mastodon</a>' },
      { t: '', h: null },
      { t: '> OSS     : OPEN SOURCE', h: null },
      { t: '  [1] nickvsnetworking/pyhss',
        h: '  [1] <a href="https://github.com/nickvsnetworking/pyhss" target="_blank" rel="noopener">nickvsnetworking/pyhss</a>' },
      { t: '  [2] sipgate/sparta-diameter',
        h: '  [2] <a href="https://github.com/sipgate/sparta-diameter" target="_blank" rel="noopener">sipgate/sparta-diameter</a>' },
      { t: '  [3] sipgate/li-lib-x1x2x3',
        h: '  [3] <a href="https://github.com/sipgate/li-lib-x1x2x3" target="_blank" rel="noopener">sipgate/li-lib-x1x2x3</a>' },
      { t: '  [4] sipgate/li-simulator-x1x2x3',
        h: '  [4] <a href="https://github.com/sipgate/li-simulator-x1x2x3" target="_blank" rel="noopener">sipgate/li-simulator-x1x2x3</a>' },
      { t: '  [5] Takuto88/comp128-python',
        h: '  [5] <a href="https://github.com/Takuto88/comp128-python" target="_blank" rel="noopener">Takuto88/comp128-python</a>' },
    ];

    const bootEl = document.getElementById('boot');
    const tailEl = document.getElementById('tail');
    const profileEl = document.getElementById('profile');
    const clsCursor = document.getElementById('cls-cursor');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));

    function lineSpan(text, cls) {
      const s = document.createElement('span');
      if (cls) s.className = cls;
      s.textContent = text;
      return s;
    }

    // single cursor that follows the typing position
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    function placeCursor(el) {
      if (cursor.parentNode) cursor.remove();
      el.append(cursor);
    }

    async function typeInto(el, text, cls, speed) {
      placeCursor(el);
      const s = lineSpan('', cls);
      el.insertBefore(s, cursor);
      for (const ch of text) {
        s.textContent += ch;
        await wait(speed);
      }
      return s;
    }

    function newlineBeforeCursor(el) {
      if (cursor.parentNode === el) {
        el.insertBefore(document.createTextNode('\n'), cursor);
      } else {
        el.append('\n');
      }
    }

    async function run() {
      bootEl.firstChild.remove(); // remove initial cursor
      for (const [text, cls] of bootLines) {
        await typeInto(bootEl, text, cls, text.startsWith('ATDT') || text.startsWith('CARRIER') ? 34 : 14);
        newlineBeforeCursor(bootEl);
        await wait(text.startsWith('CARRIER') ? 420 : 110);
      }
      newlineBeforeCursor(bootEl);
      await wait(800); // let the session settle

      // CLS - instant clear, cursor parks at the top-left for a beat
      bootEl.hidden = true;
      clsCursor.hidden = false;
      await wait(320);

      clsCursor.hidden = true;
      profileEl.hidden = false;
      await wait(140);

      for (const line of tailLines) {
        const s = await typeInto(tailEl, line.t, null, 16);
        if (line.h) s.outerHTML = line.h;
        newlineBeforeCursor(tailEl);
      }
      placeCursor(tailEl); // leave the blinking cursor at the very end
    }

    // start once the pixel font is in, so metrics look right while typing
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => setTimeout(run, 350));
    } else {
      setTimeout(run, 350);
    }
  </script>
</body>
</html>
